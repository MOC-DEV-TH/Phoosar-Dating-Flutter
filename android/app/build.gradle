
plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.moc.phoosar"

    // Required by permission_handler_android
    compileSdk = 37

    // Required by jni and other Flutter plugins
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.moc.updatephoosar"

        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion

        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libaosl.so'
        pickFirst 'lib/x86_64/libaosl.so'
        pickFirst 'lib/x86/libaosl.so'
        pickFirst 'lib/armeabi-v7a/libaosl.so'

        exclude 'lib/armeabi-v7a/libagora_ai_denoise_extension.so'
        exclude 'lib/armeabi-v7a/libagora_spatial_audio_extension.so'
        exclude 'lib/armeabi-v7a/libagora_full_audio_format_extension.so'

        exclude 'lib/arm64-v8a/libagora_ai_denoise_extension.so'
        exclude 'lib/arm64-v8a/libagora_spatial_audio_extension.so'
        exclude 'lib/arm64-v8a/libagora_full_audio_format_extension.so'
    }

    signingConfigs {
        release {
            storeFile file("../phoosar-keystore.jks")

            // Prefer loading these credentials from key.properties
            // or environment variables before production builds.
            storePassword = project.findProperty("PHOOSAR_STORE_PASSWORD") ?: System.getenv("PHOOSAR_STORE_PASSWORD")
            keyAlias = project.findProperty("PHOOSAR_KEY_ALIAS") ?: System.getenv("PHOOSAR_KEY_ALIAS")
            keyPassword = project.findProperty("PHOOSAR_KEY_PASSWORD") ?: System.getenv("PHOOSAR_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile(
                    'proguard-android.txt'
            ), 'proguard-rules.pro'

            signingConfig = signingConfigs.release
        }
    }
}

dependencies {
    // Required by newer flutter_local_notifications
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.4.1'

    // TikTok Business SDK
    implementation 'com.github.tiktok:tiktok-business-android-sdk:1.4.1'

    // Application lifecycle
    implementation 'androidx.lifecycle:lifecycle-process:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.4.0'

    // Google Install Referrer
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Google Play Billing
    implementation 'com.android.billingclient:billing:8.0.0'
}

flutter {
    source = "../.."
}
